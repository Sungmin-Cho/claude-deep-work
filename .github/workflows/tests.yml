name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime-windows:
    runs-on: windows-latest
    name: runtime contract (windows-latest)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          check-latest: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'

      - name: Install validation tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run native Windows runtime contract
        run: npm run test:runtime

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: tests (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          check-latest: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'

      - name: Install validation tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Show bash version (M5.5 #4 — bash 3.2 visibility)
        run: bash --version

      - name: Run full Node test suite
        run: npm test

      - name: Run bash regression scripts (phase-guard / migrate / notify / recommender)
        run: |
          bash hooks/scripts/test/test-no-notification-trigger.sh
          bash hooks/scripts/test/test-recommender-integration.sh
          bash hooks/scripts/test/test-v6.4.2-regression.sh

      - name: Shellcheck hooks (advisory)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck not installed on this runner; skipping advisory step"
            exit 0
          fi
          count=$(find hooks/scripts -type f -name '*.sh' | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "no hook scripts found; skipping"
            exit 0
          fi
          echo "running shellcheck on $count files"
          find hooks/scripts -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=warning --external-sources

  strict-portability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.20.0', '26.0.0', '26.8.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Verify exact runtime and install validation tooling
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: |
          node -e "if(process.versions.node!==process.env.EXPECTED_NODE)process.exit(1)"
          npm install --ignore-scripts --no-audit --no-fund
      - name: Strict policy conformance
        run: node --test runtime/node-tap-parser.test.js
      - name: Actual strict proof and GREEN flow
        run: node --test --test-name-pattern='portable (strict|bootstrap)' runtime/red-proof-runtime.test.js runtime/bootstrap-runtime.test.js
      - name: Public strict and mixed receipt spine
        run: node --test tests/public-execution-spine.test.js
